<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aishwarya Xerox - System Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
    <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-2xl flex items-center justify-center font-black text-2xl text-slate-950 shadow-lg shadow-amber-500/20">
      AX
    </div>

    <div>
      <h1 class="text-2xl font-black text-white">Aishwarya Xerox</h1>
      <p class="text-xs text-amber-300 font-semibold uppercase tracking-widest mt-1">Smart Self-Service Printing Kiosk</p>
    </div>

    <div class="space-y-3 pt-2">
      <a href="/mobile" class="block w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black rounded-2xl shadow-lg shadow-amber-500/20 hover:scale-[1.02] active:scale-95 transition">
        📱 Open Customer Mobile Web App
      </a>

      <a href="/kiosk" class="block w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl border border-slate-700 hover:scale-[1.02] active:scale-95 transition">
        📺 Open Outside Kiosk TV Screen
      </a>

      <a href="/admin" class="block w-full py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl border border-slate-700 hover:scale-[1.02] active:scale-95 transition">
        🛠️ Shop Owner Admin Dashboard
      </a>
    </div>

    <p class="text-[11px] text-slate-500">
      Connected to Canon LAN Multifunction Printer
    </p>
  </div>
</body>
</html>
